name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-x86:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: sudo apt install libsrtp2-dev libpcap-dev
    - name: uname
      run: uname -a
    - name: build
      run: make env app

  build-arm:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: sudo apt install libsrtp2-dev libpcap-dev
    - name: uname
      run: uname -a
    - name: build
      run: make env app
