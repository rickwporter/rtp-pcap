name: Build and Coverage CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-x86:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: sudo apt install libsrtp2-dev libpcap-dev
    - name: uname
      run: uname -a
    - name: build
      run: make app
    - name: coverage
      run: make coverage
    - name: upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-x86
        path: coverage/
        if-no-files-found: ignore

  build-arm:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: sudo apt install libsrtp2-dev libpcap-dev
    - name: uname
      run: uname -a
    - name: build
      run: make app
    - name: coverage
      run: make coverage
    - name: upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-arm
        path: coverage/
        if-no-files-found: ignore
