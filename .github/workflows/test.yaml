name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-x86:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: sudo apt install libsrtp2-dev libpcap-dev
    - name: uname
      run: uname -a
    - name: prereq
      run: make prereq
    - name: coverage
      run: make env coverage

  test-arm:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: sudo apt install libsrtp2-dev libpcap-dev
    - name: uname
      run: uname -a
    - name: prereq
      run: make prereq
    - name: coverage
      run: make env coverage
